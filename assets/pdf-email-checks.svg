<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc"><title id="title">Check a PDF before sending</title><desc id="desc">1. Check the limit Sending and receiving accounts Count all attachments together.. 2. Inspect the copy Small text, pages and signatures Keep the original unchanged.. 3. Test delivery Checked attachment or approved link Confirm recipient access.</desc><rect width="640" height="580" rx="24" fill="#eee8f6"/><g font-family="system-ui, sans-serif" fill="#282431"><text x="32" y="54" font-size="32" font-weight="700">Check a PDF before sending</text><rect x="24" y="82" width="592" height="134" rx="16" fill="#fff"/><text x="44" y="119" font-size="32" font-weight="700">1. Check the limit</text><text x="44" y="158" font-size="32">Sending and receiving accounts</text><text x="44" y="191" font-size="32" fill="#655d6e">Count all attachments together.</text><rect x="24" y="240" width="592" height="134" rx="16" fill="#fff"/><text x="44" y="277" font-size="32" font-weight="700">2. Inspect the copy</text><text x="44" y="316" font-size="32">Small text, pages and signatures</text><text x="44" y="349" font-size="32" fill="#655d6e">Keep the original unchanged.</text><rect x="24" y="398" width="592" height="134" rx="16" fill="#fff"/><text x="44" y="435" font-size="32" font-weight="700">3. Test delivery</text><text x="44" y="474" font-size="32">Checked attachment or approved link</text><text x="44" y="507" font-size="32" fill="#655d6e">Confirm recipient access.</text></g></svg>