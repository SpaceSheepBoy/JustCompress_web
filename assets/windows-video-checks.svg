<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750"><rect width="640" height="750" rx="22" fill="#eaf2fb"/><rect x="20" y="83" width="600" height="175" rx="20" fill="#fff" stroke="#a7c3dd"/><text x="42" y="125" font-family="system-ui,sans-serif" font-size="25" fill="#142c44">1. Compare the copied file</text><text x="42" y="164" font-family="system-ui,sans-serif" font-size="23" fill="#142c44">Incomplete size or duration?</text><text x="42" y="203" font-family="system-ui,sans-serif" font-size="23" fill="#142c44">Transfer again before converting.</text><rect x="20" y="283" width="600" height="175" rx="20" fill="#fff" stroke="#a7c3dd"/><text x="42" y="325" font-family="system-ui,sans-serif" font-size="25" fill="#142c44">2. Read the player error</text><text x="42" y="364" font-family="system-ui,sans-serif" font-size="23" fill="#142c44">Missing HEVC support?</text><text x="42" y="403" font-family="system-ui,sans-serif" font-size="23" fill="#142c44">Check the official codec option.</text><rect x="20" y="483" width="600" height="175" rx="20" fill="#fff" stroke="#a7c3dd"/><text x="42" y="525" font-family="system-ui,sans-serif" font-size="25" fill="#142c44">3. Test an H.264 MP4 copy</text><text x="42" y="564" font-family="system-ui,sans-serif" font-size="23" fill="#142c44">Keep the original unchanged.</text><text x="42" y="603" font-family="system-ui,sans-serif" font-size="23" fill="#142c44">Check picture, sound and ending.</text></svg>