<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc"><title id="title">Where the file operation happens</title><desc id="desc">Local processing: original file, your device, exported copy. Cloud processing: upload copy, remote service, download result.</desc><rect width="640" height="500" rx="24" fill="#eee8f6"/><g font-family="system-ui,sans-serif" fill="#282431"><text x="30" y="50" font-size="36" font-weight="700">Where does the file go?</text><rect x="24" y="78" width="592" height="174" rx="16" fill="#fff"/><text x="44" y="118" font-size="36" font-weight="700">Local processing</text><text x="44" y="160" font-size="36">File → your device → copy</text><text x="44" y="202" font-size="36" fill="#655d6e">No processing upload.</text><rect x="24" y="272" width="592" height="174" rx="16" fill="#fff"/><text x="44" y="312" font-size="36" font-weight="700">Cloud processing</text><text x="44" y="354" font-size="36">Upload → service → result</text><text x="44" y="396" font-size="36" fill="#655d6e">Check access and retention rules.</text></g></svg>
