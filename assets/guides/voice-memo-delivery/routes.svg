<svg xmlns="http://www.w3.org/2000/svg" width="560" height="610" viewBox="0 0 560 610"><rect width="560" height="610" rx="24" fill="#eee8f6"/><text x="30" y="55" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#30243f">A long recording will not send?</text><rect x="25" y="90" width="510" height="125" rx="16" fill="white"/><text x="48" y="133" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#30243f">Recipient nearby?</text><text x="48" y="175" font-family="system-ui,sans-serif" font-size="28" fill="#655d6e">AirDrop the recording</text><rect x="25" y="255" width="510" height="125" rx="16" fill="white"/><text x="48" y="298" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#30243f">Email attachment too large?</text><text x="48" y="340" font-family="system-ui,sans-serif" font-size="28" fill="#655d6e">Use Mail Drop if offered</text><rect x="25" y="420" width="510" height="125" rx="16" fill="white"/><text x="48" y="463" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#30243f">Need a smaller attachment?</text><text x="48" y="505" font-family="system-ui,sans-serif" font-size="28" fill="#655d6e">Compress a separate copy</text></svg>