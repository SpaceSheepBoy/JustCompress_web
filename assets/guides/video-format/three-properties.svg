<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480"><rect width="560" height="480" rx="28" fill="#f0ecf6"/><g font-family="Arial,sans-serif" fill="#292131"><text x="28" y="48" font-size="28" font-weight="700">One video. Three properties.</text><rect x="24" y="78" width="512" height="108" rx="16" fill="white"/><text x="44" y="118" font-size="29" font-weight="700">MP4 or MOV</text><text x="44" y="156" font-size="25">Container: packages the tracks</text><rect x="24" y="204" width="512" height="108" rx="16" fill="white"/><text x="44" y="244" font-size="29" font-weight="700">HEVC or H.264</text><text x="44" y="282" font-size="25">Codec: encodes the pictures</text><rect x="24" y="330" width="512" height="108" rx="16" fill="white"/><text x="44" y="370" font-size="29" font-weight="700">HDR or SDR</text><text x="44" y="408" font-size="25">Color and brightness handling</text></g></svg>