<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><rect width="640" height="480" rx="22" fill="#f1edf5"/><g font-family="Arial,sans-serif" fill="#30243f"><text x="36" y="52" font-size="27" font-weight="bold">A practical export check</text><rect x="28" y="90" width="584" height="96" rx="14" fill="white"/><circle cx="62" cy="125" r="20" fill="#30243f"/><text x="55" y="133" font-size="24" fill="white">1</text><text x="98" y="124" font-size="23" font-weight="bold">Keep the original</text><text x="98" y="156" font-size="20">Make a separate sharing copy.</text><rect x="28" y="207" width="584" height="96" rx="14" fill="white"/><circle cx="62" cy="242" r="20" fill="#30243f"/><text x="55" y="250" font-size="24" fill="white">2</text><text x="98" y="241" font-size="23" font-weight="bold">Export a short difficult section</text><text x="98" y="273" font-size="20">Listen for muffling, warble or harsh consonants.</text><rect x="28" y="324" width="584" height="96" rx="14" fill="white"/><circle cx="62" cy="359" r="20" fill="#30243f"/><text x="55" y="367" font-size="24" fill="white">3</text><text x="98" y="358" font-size="23" font-weight="bold">Check size and destination</text><text x="98" y="390" font-size="20">Too large? Reduce rate or trim, then listen again.</text></g></svg>