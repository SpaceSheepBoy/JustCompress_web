<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520"><rect width="560" height="520" rx="24" fill="#f0ecf6"/><g font-family="Arial,sans-serif" fill="#292131"><text x="24" y="44" font-size="29" font-weight="700">More cells, less space per image.</text><text x="24" y="91" font-size="25">Example: a 1200 px-wide export</text><rect x="24" y="116" width="512" height="142" rx="16" fill="#fff"/><text x="44" y="158" font-size="28" font-weight="700">2 columns</text><text x="44" y="204" font-size="27">About 600 px per image</text><rect x="24" y="280" width="512" height="142" rx="16" fill="#fff"/><text x="44" y="322" font-size="28" font-weight="700">3 columns</text><text x="44" y="368" font-size="27">About 400 px per image</text><text x="24" y="469" font-size="24">Before gaps and outer margins.</text></g></svg>